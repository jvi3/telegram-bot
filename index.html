<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Китайский дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Press+Start+2P&display=swap">
<style>
:root{
  --felt:#123a33; --felt-2:#0c2b26; --felt-line:#1f5148;
  --brass:#e2ad4b; --brass-ink:#2a1d05;
  --ivory:#f7f1e1; --ink:#1c1b19; --red:#c23a2b;
  --text:#e9efe9; --muted:#9fb7ae;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(46px,11.5vw,66px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-2) 100%) fixed;background-color:var(--felt-2);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);letter-spacing:-.01em;margin:0}
h1 b{color:var(--brass);font-weight:700}
.hdr{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-block:16px 0;gap:12px}
.app{padding-block:16px 40px}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ag{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.ag .ib{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:15px;display:grid;place-items:center;padding:0}
.ag .ib[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.ag select{font:inherit;font-size:13px;background:transparent;color:var(--text);border:0;padding:2px 0;max-width:9.5em}
.ag select option{background:var(--felt-2);color:var(--text)}
.ag input[type=range]{width:84px;accent-color:var(--brass);padding:0;border:0;background:transparent}
.ag .pct{min-width:2.6em;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.brand{display:flex;flex-direction:column;gap:2px}
.by{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h2{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--felt-line)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font:inherit;background:var(--felt-2);color:var(--text);border:1px solid var(--felt-line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus{border-color:var(--brass);outline:none}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--felt-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rule{display:flex;gap:12px;align-items:center}
.rule p{font-size:13px;color:var(--muted)}
.rule strong{display:block;color:var(--text);font-size:14px}
.code{font-family:var(--display);letter-spacing:.12em;color:var(--brass)}
.banner{background:rgba(255,138,122,.12);border:1px solid rgba(255,138,122,.4);border-radius:12px;padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.card{width:var(--cw);aspect-ratio:5/7;border-radius:7px;background:var(--ivory);color:var(--ink);border:0;position:relative;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-family:var(--display);font-weight:700;transition:transform .12s}
.card.red{color:var(--red)}
.card .r{font-size:calc(var(--cw)*.27);line-height:1;text-align:left}
.card .s{font-size:calc(var(--cw)*.42);line-height:1;text-align:center;font-family:var(--body)}
.card .r2{font-size:calc(var(--cw)*.27);line-height:1;text-align:right;transform:rotate(180deg)}
.card.special::after{content:attr(data-tag);position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:600 9px/1 var(--body);background:var(--brass);color:var(--brass-ink);padding:3px 5px;border-radius:999px;white-space:nowrap}
.card.glass{background:rgba(247,241,225,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.2)}
.card.back{background:repeating-linear-gradient(45deg,#7a2d22 0 6px,#8f3628 6px 12px);box-shadow:inset 0 0 0 3px var(--ivory),0 4px 10px rgba(0,0,0,.3)}
.card.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--felt-line)}
button.card:disabled{cursor:default}
.card.sel{transform:translateY(-12px)!important;box-shadow:0 0 0 3px var(--brass),0 10px 20px rgba(0,0,0,.35)}
.card.dim{filter:brightness(.6)}
/* Оформление колоды: переменные темы карт */
:root,[data-cards="classic"]{
  --c-bg:#f7f1e1; --c-tex:none; --c-ink:#1c1b19; --c-red:#c23a2b; --c-edge:transparent; --c-edge-w:0px;
  --c-font:"Unbounded",system-ui,sans-serif; --c-radius:7px; --c-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);
  --c-glass:rgba(247,241,225,.55); --c-glass-edge:rgba(255,255,255,.7);
  --c-back:repeating-linear-gradient(45deg,#7a2d22 0 6px,#8f3628 6px 12px); --c-back-edge:#f7f1e1; --c-rank:.27;
}
[data-cards="noir"]{
  --c-bg:linear-gradient(160deg,#2a2a30 0%,#121215 100%); --c-tex:none; --c-ink:#f3efe6; --c-red:#ff6b5e;
  --c-edge:rgba(226,173,75,.7); --c-edge-w:1px; --c-font:"Unbounded",system-ui,sans-serif; --c-radius:7px;
  --c-shadow:0 2px 0 rgba(0,0,0,.4),0 8px 16px rgba(0,0,0,.4);
  --c-glass:rgba(40,40,46,.5); --c-glass-edge:rgba(226,173,75,.6);
  --c-back:radial-gradient(circle,rgba(226,173,75,.55) 0 1.5px,transparent 2px) 0 0/8px 8px,linear-gradient(160deg,#1c1c20,#0d0d0f);
  --c-back-edge:#e2ad4b; --c-rank:.27;
}
[data-cards="vintage"]{
  --c-bg:#eadcbc;
  --c-tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(110,70,20,.28) 100%);
  --c-ink:#3a2a18; --c-red:#9a2e1c; --c-edge:rgba(90,60,20,.45); --c-edge-w:1px;
  --c-font:Georgia,"Times New Roman",serif; --c-radius:6px;
  --c-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);
  --c-glass:rgba(234,220,188,.5); --c-glass-edge:rgba(255,245,220,.7);
  --c-back:repeating-linear-gradient(45deg,rgba(234,220,188,.13) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(234,220,188,.13) 0 2px,transparent 2px 7px),#1f4a3a;
  --c-back-edge:#eadcbc; --c-rank:.3;
}
[data-cards="royal"]{
  --c-bg:linear-gradient(160deg,#26346a 0%,#141c3a 100%); --c-tex:none; --c-ink:#f0cf7a; --c-red:#ff8f7e;
  --c-edge:#f0cf7a; --c-edge-w:1.5px; --c-font:"Unbounded",system-ui,sans-serif; --c-radius:8px;
  --c-shadow:0 2px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.35);
  --c-glass:rgba(38,52,106,.5); --c-glass-edge:rgba(240,207,122,.7);
  --c-back:repeating-conic-gradient(from 45deg,#1a2446 0 25%,#26346a 0 50%) 0 0/12px 12px;
  --c-back-edge:#f0cf7a; --c-rank:.27;
}
[data-cards="pixel"]{
  --c-bg:#fdfdf6; --c-tex:none; --c-ink:#141414; --c-red:#d92b2b; --c-edge:#141414; --c-edge-w:2.5px;
  --c-font:"Press Start 2P",ui-monospace,monospace; --c-radius:2px; --c-shadow:3px 3px 0 #000;
  --c-glass:rgba(253,253,246,.5); --c-glass-edge:#141414;
  --c-back:repeating-conic-gradient(#2d3bd6 0 25%,#4656ff 0 50%) 0 0/10px 10px; --c-back-edge:#fdfdf6; --c-rank:.19;
}
.card{background:var(--c-tex),var(--c-bg);color:var(--c-ink);font-family:var(--c-font);border-radius:var(--c-radius);box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),var(--c-shadow)}
.card.red{color:var(--c-red)}
.card .r,.card .r2{font-size:calc(var(--cw)*var(--c-rank))}
.card.glass{background:var(--c-glass);box-shadow:inset 0 0 0 2px var(--c-glass-edge),0 6px 14px rgba(0,0,0,.2)}
.card.back{background:var(--c-back);box-shadow:inset 0 0 0 3px var(--c-back-edge),0 4px 10px rgba(0,0,0,.3)}
.card.empty{background:transparent;box-shadow:none}
.card.sel{box-shadow:0 0 0 3px var(--brass),0 10px 20px rgba(0,0,0,.35)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.theme{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--felt-line);color:var(--text)}
.theme:hover{border-color:var(--muted)}
.theme[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(226,173,75,.25)}
.theme .duo{display:flex;gap:5px;--cw:34px}
.theme .duo .card{padding:3px 4px}
.theme .duo .card.special::after{display:none}
.theme span{font-size:13px;font-weight:500}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opp{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid transparent;display:flex;flex-direction:column;gap:8px;min-width:0}
.opp.turn{border-color:var(--brass);box-shadow:0 0 0 3px rgba(226,173,75,.15)}
.opp .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{--cw:30px}
.mini .card{padding:2px 3px;border-radius:4px}
.mini .card.special::after{display:none}
.stack{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--text)}
.center{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px;border-radius:20px;background:rgba(0,0,0,.14);border:1px solid var(--felt-line)}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.pile{position:relative;height:calc(var(--cw)*1.4 + 8px);width:calc(var(--cw)*2.6)}
.pile .card{position:absolute;top:4px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-family:var(--display);font-size:clamp(14px,3.6vw,18px);text-align:center}
.status b{color:var(--brass)}
.need{font-size:13px;color:var(--muted);text-align:center}
.seat{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid var(--felt-line)}
.seat.turn{border-color:var(--brass)}
.tableau{display:flex;gap:8px;flex-wrap:wrap}
.slot{position:relative;width:var(--cw);aspect-ratio:5/7}
.slot>.card{position:absolute;inset:0;width:100%}
.slot>.card.upc{transform:translate(4px,-6px)}
.slot>.card.upc.sel{transform:translate(4px,-16px)!important}
.hand{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px;min-height:calc(var(--cw)*1.4 + 14px)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log div:first-child{color:var(--text)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:999px;font-size:14px}
.result ol{margin:0;padding-left:20px}
.tablewrap{overflow-x:auto}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.board th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--felt-line)}
.board td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.board td:first-child{color:var(--brass);font-family:var(--display);width:2em}
.board .nm{max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board tr.meRow td{background:rgba(226,173,75,.08)}
.loser{font-family:var(--display);font-size:clamp(18px,4.5vw,26px);color:var(--brass)}
@media (max-width:560px){.center{grid-template-columns:auto minmax(0,1fr) auto;padding:10px 8px;gap:6px}.need{font-size:12px}.status{font-size:14px}}

/* ---------- подгонка под экран и анимации ---------- */
:root{--cwb:clamp(38px,min(11.5vw,7vh),66px);--cw:var(--cwb);--gap:18px}
@media (max-height:820px){:root{--gap:10px}.wrap.app{gap:10px;padding-block:10px 24px}.center{padding:12px;gap:10px}.seat{padding:12px;gap:8px}.opp{padding:8px 10px;gap:6px}.panel{padding:12px}.hand{padding-top:10px}h1{font-size:clamp(18px,4.4vw,28px)}}
.mini{--cw:clamp(22px,calc(var(--cwb)*.5),30px)}
.center .side{--cw:calc(var(--cwb)*.72)}
.hdr .gear{padding:7px 14px;font-size:13px}
.hdr .audio{flex-basis:100%}
@keyframes flyin{0%{transform:translate(0,120%) rotate(-18deg) scale(.65);opacity:0}55%{transform:translate(0,-8%) rotate(3deg) scale(1.12);opacity:1}78%{transform:translate(0,2%) rotate(-1deg) scale(.97)}100%{transform:var(--rot,none);opacity:1}}
@keyframes drawin{0%{transform:translate(0,-70px) scale(.7) rotate(8deg);opacity:0}60%{transform:translate(0,6px) scale(1.08) rotate(-2deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes dealin{0%{transform:translate(0,-160px) rotate(18deg) scale(.6);opacity:0}100%{opacity:1}}
@keyframes burnfx{0%{transform:scale(.3);opacity:.95}60%{opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes burntxt{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(226,173,75,.0)}50%{box-shadow:0 0 0 6px rgba(226,173,75,.22)}}
.pile .card{transform:var(--rot,none)}
.pile .card.fresh{animation:flyin .7s cubic-bezier(.18,.9,.25,1.25) both}
.hand>.card.drawin{animation:drawin .6s cubic-bezier(.18,.9,.3,1.3) both}
.seat .card.dealin{animation:dealin .75s cubic-bezier(.18,.85,.3,1.2) both}
.pile.burning{animation:shake .6s ease-in-out}
.burnfx{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1.6);height:calc(var(--cw)*1.6);margin:calc(var(--cw)*-.8) 0 0 calc(var(--cw)*-.8);border-radius:50%;background:radial-gradient(circle,#fff3c4 0%,#ffb340 30%,#e2522b 60%,transparent 72%);animation:burnfx 1.1s ease-out forwards;pointer-events:none}
.burntxt{position:absolute;left:50%;top:50%;font-family:var(--display);font-weight:700;font-size:15px;color:#ffd27a;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap;animation:burntxt 1.7s ease-out forwards;pointer-events:none}
.status.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.4)}
.seat.turn,.opp.turn{animation:glow 1.8s ease-in-out infinite}
.loser{animation:pop .5s ease-out}



/* ---------- фоны, экраны настроек и магазина, подсветки, эффекты ---------- */
#bgcanvas{position:fixed;inset:0;width:100vw;height:100vh;height:100lvh;image-rendering:pixelated;z-index:0;pointer-events:none}
header.wrap,.wrap.app{position:relative;z-index:1}
.fxcanvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:40;pointer-events:none}
.panel,.center,.seat,.opp{background:rgba(6,18,16,.72)}
.opp,.seat{position:relative}
.nav{display:flex;gap:6px;align-items:center}
.nav .btn{padding:7px 12px;font-size:14px}
.coins{background:rgba(0,0,0,.35);color:var(--brass);border:1px solid rgba(226,173,75,.45);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.vtitle{font-size:18px}
.ntag{display:flex;flex-direction:column;gap:1px;min-width:0}
.name{display:flex;align-items:center;gap:6px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name .dot{width:9px;height:9px;border-radius:50%;background:var(--pc,#f2c14e);flex:none;box-shadow:0 0 6px var(--pc,#f2c14e)}
.ptitle{font-size:11px;color:var(--brass);letter-spacing:.04em;padding-left:15px}
.hat{display:inline-flex;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
@keyframes glowo{0%,100%{opacity:.15}50%{opacity:1}}
.opp.turn,.seat.turn{animation:none;border-color:rgba(255,255,255,.15)}
:root[data-hlturn] .opp.turn,:root[data-hlturn] .seat.turn{border-color:var(--pc)}
:root[data-hlturn] .opp.turn::after,:root[data-hlturn] .seat.turn::after{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 0 1px var(--pc),0 0 16px 2px var(--pc);pointer-events:none;animation:glowo 1.8s ease-in-out infinite;will-change:opacity}
:root[data-anim="off"] .opp.turn::after,:root[data-anim="off"] .seat.turn::after{animation:none;opacity:.6}
:root[data-hlturn] .opp.turn .name span,:root[data-hlturn] .status b{color:var(--pc)}
.card.owned{box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),0 0 0 2px var(--own),var(--c-shadow)}
.card.can{box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),0 0 10px 1px color-mix(in srgb,var(--mycolor) 60%,transparent),var(--c-shadow)}
.seat .card.sel{box-shadow:0 0 0 3px var(--mycolor),0 0 18px 3px color-mix(in srgb,var(--mycolor) 55%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--felt-line);text-align:center}
.tile.on{border-color:var(--brass);box-shadow:0 0 0 2px rgba(226,173,75,.22)}
.tprev{min-height:64px;display:flex;align-items:center;justify-content:center;width:100%}
.tprev.duo{gap:4px;--cw:30px}
.tprev.duo .card{padding:2px 3px}
.tprev.duo .card.special::after{display:none}
.tprev.emo{font-size:26px;letter-spacing:4px}
.bgprev{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--felt-line)}
.bgprev canvas,.bgprev img{width:100%;aspect-ratio:16/10;image-rendering:pixelated;display:block}

function soundsFor(prev,next){
  if(!next||!me) return;
  if(!prev||prev.code!==next.code){ if(next.status==="swap") Sound.fx("deal"); return; }
  if(prev.status!=="swap"&&next.status==="swap") return Sound.fx("deal");
  if(prev.status!=="over"&&next.status==="over"){ if(next.players.some(p=>p.id===me.id)) Sound.fx(next.loser===me.id?"lose":"win"); return; }
  if(next.status!=="play") return;
  const added=next.pile.length-prev.pile.length;
  if(next.burned>prev.burned){ Sound.fx("play"); setTimeout(()=>Sound.fx("burn"),90); }
  else if(added>0){ const top=next.pile[next.pile.length-1]; if(rk(top)==="8") Sound.fx("glass"); else Sound.fx("play",added); }
  else if(prev.pile.length>0&&next.pile.length===0) Sound.fx("take");
  const drew=cnt(prev.deck)-cnt(next.deck);
  if(drew>0) setTimeout(()=>Sound.fx("draw",drew),180);
  const pT=prev.status==="play"&&prev.players[prev.turn]&&prev.players[prev.turn].id;
  const nT=next.players[next.turn]&&next.players[next.turn].id;
  if(nT===me.id&&pT!==me.id) setTimeout(()=>Sound.fx("turn"),380);
}

const Fx=(()=>{
  let cv=null, raf=null;
  function run(kind){
    if(Prefs.get("anim")==="off") return;
    if(!cv){ cv=document.createElement("canvas"); cv.className="fxcanvas"; cv.setAttribute("aria-hidden","true"); document.body.append(cv); }
    const S=4, W=Math.ceil(innerWidth/S), H=Math.ceil(innerHeight/S); cv.width=W; cv.height=H; const c=cv.getContext("2d");
    const cols=["#f2c14e","#7ee0b5","#ff8b7b","#b9a4ff","#7cc4ff","#c7e86a","#ffffff"];
    const P=[]; const t0=performance.now(); const dur=kind==="fireworks"?2800:3200;
    const burst=(x,y)=>{ const col=cols[Math.random()*cols.length|0]; for(let i=0;i<40;i++){ const a=Math.random()*Math.PI*2, v=.6+Math.random()*1.6; P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.03,life:55+Math.random()*25,col,s:1}); } Sound.fx("draw",1); };
    if(kind==="confetti") for(let i=0;i<160;i++) P.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*.4,vy:.4+Math.random()*.6,g:0,life:999,col:cols[Math.random()*6|0],s:Math.random()<.5?1:2,spin:Math.random()*6});
    if(kind==="coins") for(let i=0;i<70;i++) P.push({x:Math.random()*W,y:-Math.random()*H*1.2,vx:0,vy:.5+Math.random()*.7,g:.004,life:999,coin:1,spin:Math.random()*6});
    const plan=kind==="fireworks"?[[0,.3,.35],[350,.7,.3],[700,.5,.22],[1100,.25,.25],[1400,.78,.4]]:[];
    if(kind==="coins") Sound.fx("coin");
    cancelAnimationFrame(raf);
    const step=t=>{
      const el=t-t0; c.clearRect(0,0,W,H);
      while(plan.length&&plan[0][0]<=el){ const [,fx,fy]=plan.shift(); burst(W*fx,H*fy); }
      for(const p of P){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; if(p.life<=0) continue;
        if(p.coin){ const w=Math.abs(Math.sin(el/180+p.spin))*3+1; c.fillStyle="#b9862c"; c.fillRect(p.x-w/2,p.y,w,4); c.fillStyle="#f2c14e"; c.fillRect(p.x-w/2+ (w>2?.5:0),p.y+.5,Math.max(1,w-1),3); }

      if(el<dur) raf=requestAnimationFrame(step); else c.clearRect(0,0,W,H);
    };
    raf=requestAnimationFrame(step);
  }
  function shake(){ if(Prefs.get("anim")==="off") return; app.classList.remove("shakeall"); void app.offsetWidth; app.classList.add("shakeall"); haptic("heavy"); }
  function bigText(text,cls){ const e=el("div",{class:"bigtxt "+(cls||""),text}); document.body.append(e); setTimeout(()=>e.remove(),1600); }
  function emoji(e,fromEl){

    const f=el("div",{class:"floatemoji",text:e}); f.style.left=(r.left+r.width/2-18+(Math.random()*30-15))+"px"; f.style.top=(r.top+Math.min(r.height,60)/2)+"px";
    document.body.append(f); setTimeout(()=>f.remove(),1800);
  }
  function coinPop(delta){ const b=document.getElementById("coinsBtn"); const r=b&&!b.hidden?b.getBoundingClientRect():{left:innerWidth-90,top:20,width:60,height:20};
    const f=el("div",{class:"coinpop"+(delta<0?" neg":""),text:(delta>=0?"+":"−")+"$"+Math.abs(delta)}); f.style.left=(r.left+r.width/2-24)+"px"; f.style.top=(r.top+r.height)+"px"; document.body.append(f); setTimeout(()=>f.remove(),1700); }

})();

function parseYT(u){
  u=String(u||"").trim(); if(!u) return null;
  let url; try{ url=new URL(/^https?:/i.test(u)?u:"https://"+u); }catch(e){ return null; }
  const host=url.hostname.replace(/^www\.|^m\.|^music\./,"");
  const ok=/^[\w-]{6,}$/;
  const list=url.searchParams.get("list");
  let id=null;
  if(host==="youtu.be") id=url.pathname.slice(1).split("/")[0];
  else if(host==="youtube.com"||host==="youtube-nocookie.com"){
    if(url.pathname==="/watch") id=url.searchParams.get("v");
    else { const m=url.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/); if(m) id=m[2]; }
  } else return null;
  if(id&&!ok.test(id)) id=null;
  if(list&&ok.test(list)) return {list,id};
  return id?{id}:null;
}
function ytSrc(v){
  const base="https://www.youtube-nocookie.com/embed/";
  const q="autoplay=1&playsinline=1&rel=0&modestbranding=1";
  if(v.list) return base+(v.id?v.id:"videoseries")+"?list="+encodeURIComponent(v.list)+"&"+q+"&loop=1";
  return base+v.id+"?"+q+"&loop=1&playlist="+v.id;
}

function makeReels(n){
  const wrap=el("div",{class:"reels r"+n}); const cols=[];
  const randSym=pool=>pool[Math.random()*pool.length|0];
  for(let i=0;i<n;i++){ const strip=el("div",{class:"strip"}); const col=el("div",{class:"reelc"},strip); wrap.append(col); cols.push({col,strip}); }
  function show(grid){ cols.forEach((c,i)=>{ c.strip.replaceChildren(...grid[i].map(s=>el("div",{class:"cellc"},symImg(s)))); c.strip.style.transition="none"; c.strip.style.transform="translateY(0)"; }); }
  function spin(grid,pool,fast){
    const k=Prefs.get("anim")==="off"?0:Prefs.get("anim")==="fast"?.55:fast?.6:1;
    if(!k){ show(grid); return Promise.resolve(); }
    return new Promise(res=>{
      let done=0; const H=cols[0].col.clientHeight/3;
      cols.forEach((c,i)=>{
        const cur=[...c.strip.children].slice(-3).map(x=>x.firstChild.getAttribute("alt"));
        const filler=Array.from({length:14+i*5},()=>randSym(pool));
        const all=[...c.strip.children].slice(-3).map(x=>x.cloneNode(true));
        c.strip.replaceChildren(...all,...filler.map(s=>el("div",{class:"cellc blur"},symImg(s))),...grid[i].map(s=>el("div",{class:"cellc"},symImg(s))));
        c.strip.style.transition="none"; c.strip.style.transform="translateY(0)"; void c.strip.offsetHeight;
        const dur=(0.9+i*0.32)*k, dist=(3+filler.length)*H;
        c.strip.style.transition=`transform ${dur}s cubic-bezier(.12,.7,.18,1.06)`; c.strip.style.transform=`translateY(${-dist}px)`;
        const tk=setInterval(()=>Sound.fx("reel"),90);
        setTimeout(()=>{ clearInterval(tk); Sound.fx("stop"); c.col.classList.remove("thunk"); void c.col.offsetWidth; c.col.classList.add("thunk"); c.strip.style.transition="none"; c.strip.replaceChildren(...grid[i].map(s=>el("div",{class:"cellc"},symImg(s)))); c.strip.style.transform="translateY(0)"; if(++done===cols.length) res(); },dur*1000+40);
      });
    });
  }
  function mark(cells){ cols.forEach(c=>[...c.strip.children].forEach(x=>x.classList.remove("winc"))); cells.forEach(([r,row])=>{ const x=cols[r]&&cols[r].strip.children[row]; if(x) x.classList.add("winc"); }); }
  return {wrap,show,spin,mark};
}

/* ---------- очередь состояний: даём доиграть перевороту закрытой карты ---------- */

function queueState(nr,at){ stateQ.push([nr,at]); if(!holding) pumpStates(); }
function pumpStates(){
  while(stateQ.length&&!holding){
    const [nr,at]=stateQ.shift();
    const lb=nr.lastBlind;
    if(lb&&room&&room.code===nr.code&&lb.seq!==blindSeen&&(room.status==="play")&&Prefs.get("anim")!=="off"){
      blindSeen=lb.seq; holding=true;
      flipReveal(lb,nr,()=>{ holding=false; applyState(nr,at); pumpStates(); });
      return;
    }
    if(lb) blindSeen=lb.seq;
    applyState(nr,at);
  }
}
function applyState(nr,at){
      const prevTurn=room&&room.status==="play"&&room.players[room.turn]&&room.players[room.turn].id;
      const prevR=room; room=nr; soundsFor(prevR,room);

  ws.onopen=()=>{
    const hello={t:"hello",initData:TG?TG.initData:""};
    if(window.__DEV__){ let d=store.get("durak.dev"); if(!d){d=Math.random().toString(36).slice(2,10);store.set("durak.dev",d);} hello.dev=d; hello.name=store.get("durak.name")||("Игрок "+d.slice(0,3)); }

  ws.onmessage=e=>{
    let m; try{m=JSON.parse(e.data)}catch(_){return}
    if(m.t==="me"){

      const code=pendingRoom||store.get("durak.room"); pendingRoom=null;
      if(code) sendMsg({t:"enter",code}); else render();

    } else if(m.t==="board"){

    } else if(m.t==="state"){
      queueState(m.room,Date.now());
    } else if(m.t==="gone"){
      if(room&&room.code===m.code) toast("Комнату закрыли");

}

function fanHand(box){
  const cards=[...box.children].filter(c=>c.classList.contains("card")), n=cards.length; if(!n) return;
  box.classList.add("fan");
  const mid=(n-1)/2, spread=Math.min(5,32/n), lift=Math.min(1.8,9/n);
  box.style.paddingBottom=Math.round(mid*mid*lift+Math.min(14,n*1.6)+6)+"px";
  cards.forEach((c,i)=>{ const d=i-mid; c.style.setProperty("--fr",(d*spread).toFixed(2)+"deg"); c.style.setProperty("--fy",(d*d*lift).toFixed(1)+"px"); c.style.setProperty("--i",i); if(c.tagName==="BUTTON") addTilt(c); });
  post.push(()=>{ const h=document.querySelector(".hand.fan"); if(!h) return; const cs=[...h.querySelectorAll(":scope > .card")]; if(cs.length<2) return;
    const W=h.clientWidth, cw=cs[0].getBoundingClientRect().width; const need=cs.length*cw+(cs.length-1)*6;
    h.style.setProperty("--ov",need>W?((W-cs.length*cw)/(cs.length-1)-2).toFixed(1)+"px":"6px"); });
}

    c.style.setProperty("--ry",((x-.5)*22).toFixed(1)+"deg"); c.style.setProperty("--rx",((.5-y)*22).toFixed(1)+"deg");
    c.style.setProperty("--gx",(x*100).toFixed(0)+"%"); c.style.setProperty("--gy",(y*100).toFixed(0)+"%"); c.classList.add("tilt"); });
  c.addEventListener("pointerleave",()=>{ c.style.removeProperty("--rx"); c.style.removeProperty("--ry"); c.classList.remove("tilt"); });
}
