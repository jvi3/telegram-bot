<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Китайский дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Press+Start+2P&display=swap">
<style>
:root{
  --felt:#123a33; --felt-2:#0c2b26; --felt-line:#1f5148;
  --brass:#e2ad4b; --brass-ink:#2a1d05;
  --ivory:#f7f1e1; --ink:#1c1b19; --red:#c23a2b;
  --text:#e9efe9; --muted:#9fb7ae;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(46px,11.5vw,66px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-2) 100%) fixed;background-color:var(--felt-2);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);letter-spacing:-.01em;margin:0}
h1 b{color:var(--brass);font-weight:700}
.hdr{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-block:16px 0;gap:12px}
.app{padding-block:16px 40px}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ag{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.ag .ib{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:15px;display:grid;place-items:center;padding:0}
.ag .ib[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.ag select{font:inherit;font-size:13px;background:transparent;color:var(--text);border:0;padding:2px 0;max-width:9.5em}
.ag select option{background:var(--felt-2);color:var(--text)}
.ag input[type=range]{width:84px;accent-color:var(--brass);padding:0;border:0;background:transparent}
.ag .pct{min-width:2.6em;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.brand{display:flex;flex-direction:column;gap:2px}
.by{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h2{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--felt-line)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font:inherit;background:var(--felt-2);color:var(--text);border:1px solid var(--felt-line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus{border-color:var(--brass);outline:none}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--felt-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rule{display:flex;gap:12px;align-items:center}
.rule p{font-size:13px;color:var(--muted)}
.rule strong{display:block;color:var(--text);font-size:14px}
.code{font-family:var(--display);letter-spacing:.12em;color:var(--brass)}
.banner{background:rgba(255,138,122,.12);border:1px solid rgba(255,138,122,.4);border-radius:12px;padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.card{width:var(--cw);aspect-ratio:5/7;border-radius:7px;background:var(--ivory);color:var(--ink);border:0;position:relative;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-family:var(--display);font-weight:700;transition:transform .12s}
.card.red{color:var(--red)}
.card .r{font-size:calc(var(--cw)*.27);line-height:1;text-align:left}
.card .s{font-size:calc(var(--cw)*.42);line-height:1;text-align:center;font-family:var(--body)}
.card .r2{font-size:calc(var(--cw)*.27);line-height:1;text-align:right;transform:rotate(180deg)}
.card.special::after{content:attr(data-tag);position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:600 9px/1 var(--body);background:var(--brass);color:var(--brass-ink);padding:3px 5px;border-radius:999px;white-space:nowrap}
.card.glass{background:rgba(247,241,225,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.2)}
.card.back{background:repeating-linear-gradient(45deg,#7a2d22 0 6px,#8f3628 6px 12px);box-shadow:inset 0 0 0 3px var(--ivory),0 4px 10px rgba(0,0,0,.3)}
.card.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--felt-line)}
button.card:disabled{cursor:default}
.card.sel{transform:translateY(-12px)!important;box-shadow:0 0 0 3px var(--brass),0 10px 20px rgba(0,0,0,.35)}
.card.dim{filter:brightness(.6)}
/* Оформление колоды: переменные темы карт */
:root,[data-cards="classic"]{
  --c-bg:#f7f1e1; --c-tex:none; --c-ink:#1c1b19; --c-red:#c23a2b; --c-edge:transparent; --c-edge-w:0px;
  --c-font:"Unbounded",system-ui,sans-serif; --c-radius:7px; --c-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);
  --c-glass:rgba(247,241,225,.55); --c-glass-edge:rgba(255,255,255,.7);
  --c-back:repeating-linear-gradient(45deg,#7a2d22 0 6px,#8f3628 6px 12px); --c-back-edge:#f7f1e1; --c-rank:.27;
}
[data-cards="noir"]{
  --c-bg:linear-gradient(160deg,#2a2a30 0%,#121215 100%); --c-tex:none; --c-ink:#f3efe6; --c-red:#ff6b5e;
  --c-edge:rgba(226,173,75,.7); --c-edge-w:1px; --c-font:"Unbounded",system-ui,sans-serif; --c-radius:7px;
  --c-shadow:0 2px 0 rgba(0,0,0,.4),0 8px 16px rgba(0,0,0,.4);
  --c-glass:rgba(40,40,46,.5); --c-glass-edge:rgba(226,173,75,.6);
  --c-back:radial-gradient(circle,rgba(226,173,75,.55) 0 1.5px,transparent 2px) 0 0/8px 8px,linear-gradient(160deg,#1c1c20,#0d0d0f);
  --c-back-edge:#e2ad4b; --c-rank:.27;
}
[data-cards="vintage"]{
  --c-bg:#eadcbc;
  --c-tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(110,70,20,.28) 100%);
  --c-ink:#3a2a18; --c-red:#9a2e1c; --c-edge:rgba(90,60,20,.45); --c-edge-w:1px;
  --c-font:Georgia,"Times New Roman",serif; --c-radius:6px;
  --c-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);
  --c-glass:rgba(234,220,188,.5); --c-glass-edge:rgba(255,245,220,.7);
  --c-back:repeating-linear-gradient(45deg,rgba(234,220,188,.13) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(234,220,188,.13) 0 2px,transparent 2px 7px),#1f4a3a;
  --c-back-edge:#eadcbc; --c-rank:.3;
}
[data-cards="royal"]{
  --c-bg:linear-gradient(160deg,#26346a 0%,#141c3a 100%); --c-tex:none; --c-ink:#f0cf7a; --c-red:#ff8f7e;
  --c-edge:#f0cf7a; --c-edge-w:1.5px; --c-font:"Unbounded",system-ui,sans-serif; --c-radius:8px;
  --c-shadow:0 2px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.35);
  --c-glass:rgba(38,52,106,.5); --c-glass-edge:rgba(240,207,122,.7);
  --c-back:repeating-conic-gradient(from 45deg,#1a2446 0 25%,#26346a 0 50%) 0 0/12px 12px;
  --c-back-edge:#f0cf7a; --c-rank:.27;
}
[data-cards="pixel"]{
  --c-bg:#fdfdf6; --c-tex:none; --c-ink:#141414; --c-red:#d92b2b; --c-edge:#141414; --c-edge-w:2.5px;
  --c-font:"Press Start 2P",ui-monospace,monospace; --c-radius:2px; --c-shadow:3px 3px 0 #000;
  --c-glass:rgba(253,253,246,.5); --c-glass-edge:#141414;
  --c-back:repeating-conic-gradient(#2d3bd6 0 25%,#4656ff 0 50%) 0 0/10px 10px; --c-back-edge:#fdfdf6; --c-rank:.19;
}
.card{background:var(--c-tex),var(--c-bg);color:var(--c-ink);font-family:var(--c-font);border-radius:var(--c-radius);box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),var(--c-shadow)}
.card.red{color:var(--c-red)}
.card .r,.card .r2{font-size:calc(var(--cw)*var(--c-rank))}
.card.glass{background:var(--c-glass);box-shadow:inset 0 0 0 2px var(--c-glass-edge),0 6px 14px rgba(0,0,0,.2)}
.card.back{background:var(--c-back);box-shadow:inset 0 0 0 3px var(--c-back-edge),0 4px 10px rgba(0,0,0,.3)}
.card.empty{background:transparent;box-shadow:none}
.card.sel{box-shadow:0 0 0 3px var(--brass),0 10px 20px rgba(0,0,0,.35)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.theme{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--felt-line);color:var(--text)}
.theme:hover{border-color:var(--muted)}
.theme[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(226,173,75,.25)}
.theme .duo{display:flex;gap:5px;--cw:34px}
.theme .duo .card{padding:3px 4px}
.theme .duo .card.special::after{display:none}
.theme span{font-size:13px;font-weight:500}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opp{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid transparent;display:flex;flex-direction:column;gap:8px;min-width:0}
.opp.turn{border-color:var(--brass);box-shadow:0 0 0 3px rgba(226,173,75,.15)}
.opp .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{--cw:30px}
.mini .card{padding:2px 3px;border-radius:4px}
.mini .card.special::after{display:none}
.stack{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--text)}
.center{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px;border-radius:20px;background:rgba(0,0,0,.14);border:1px solid var(--felt-line)}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.pile{position:relative;height:calc(var(--cw)*1.4 + 8px);width:calc(var(--cw)*2.6)}
.pile .card{position:absolute;top:4px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-family:var(--display);font-size:clamp(14px,3.6vw,18px);text-align:center}
.status b{color:var(--brass)}
.need{font-size:13px;color:var(--muted);text-align:center}
.seat{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid var(--felt-line)}
.seat.turn{border-color:var(--brass)}
.tableau{display:flex;gap:8px;flex-wrap:wrap}
.slot{position:relative;width:var(--cw);aspect-ratio:5/7}
.slot>.card{position:absolute;inset:0;width:100%}
.slot>.card.upc{transform:translate(4px,-6px)}
.slot>.card.upc.sel{transform:translate(4px,-16px)!important}
.hand{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px;min-height:calc(var(--cw)*1.4 + 14px)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log div:first-child{color:var(--text)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:999px;font-size:14px}
.result ol{margin:0;padding-left:20px}
.tablewrap{overflow-x:auto}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.board th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--felt-line)}
.board td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.board td:first-child{color:var(--brass);font-family:var(--display);width:2em}
.board .nm{max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board tr.meRow td{background:rgba(226,173,75,.08)}
.loser{font-family:var(--display);font-size:clamp(18px,4.5vw,26px);color:var(--brass)}
@media (max-width:560px){.center{grid-template-columns:auto minmax(0,1fr) auto;padding:10px 8px;gap:6px}.need{font-size:12px}.status{font-size:14px}}

/* ---------- подгонка под экран и анимации ---------- */
:root{--cwb:clamp(38px,min(11.5vw,7vh),66px);--cw:var(--cwb);--gap:18px}
@media (max-height:820px){:root{--gap:10px}.wrap.app{gap:10px;padding-block:10px 24px}.center{padding:12px;gap:10px}.seat{padding:12px;gap:8px}.opp{padding:8px 10px;gap:6px}.panel{padding:12px}.hand{padding-top:10px}h1{font-size:clamp(18px,4.4vw,28px)}}
.mini{--cw:clamp(22px,calc(var(--cwb)*.5),30px)}
.center .side{--cw:calc(var(--cwb)*.72)}
.hdr .gear{padding:7px 14px;font-size:13px}
.hdr .audio{flex-basis:100%}
@keyframes flyin{0%{transform:translate(0,120%) rotate(-18deg) scale(.65);opacity:0}55%{transform:translate(0,-8%) rotate(3deg) scale(1.12);opacity:1}78%{transform:translate(0,2%) rotate(-1deg) scale(.97)}100%{transform:var(--rot,none);opacity:1}}
@keyframes drawin{0%{transform:translate(0,-70px) scale(.7) rotate(8deg);opacity:0}60%{transform:translate(0,6px) scale(1.08) rotate(-2deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes dealin{0%{transform:translate(0,-160px) rotate(18deg) scale(.6);opacity:0}100%{opacity:1}}
@keyframes burnfx{0%{transform:scale(.3);opacity:.95}60%{opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes burntxt{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(226,173,75,.0)}50%{box-shadow:0 0 0 6px rgba(226,173,75,.22)}}
.pile .card{transform:var(--rot,none)}
.pile .card.fresh{animation:flyin .7s cubic-bezier(.18,.9,.25,1.25) both}
.hand>.card.drawin{animation:drawin .6s cubic-bezier(.18,.9,.3,1.3) both}
.seat .card.dealin{animation:dealin .75s cubic-bezier(.18,.85,.3,1.2) both}
.pile.burning{animation:shake .6s ease-in-out}
.burnfx{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1.6);height:calc(var(--cw)*1.6);margin:calc(var(--cw)*-.8) 0 0 calc(var(--cw)*-.8);border-radius:50%;background:radial-gradient(circle,#fff3c4 0%,#ffb340 30%,#e2522b 60%,transparent 72%);animation:burnfx 1.1s ease-out forwards;pointer-events:none}
.burntxt{position:absolute;left:50%;top:50%;font-family:var(--display);font-weight:700;font-size:15px;color:#ffd27a;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap;animation:burntxt 1.7s ease-out forwards;pointer-events:none}
.status.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.4)}
.seat.turn,.opp.turn{animation:glow 1.8s ease-in-out infinite}
.loser{animation:pop .5s ease-out}



/* ---------- фоны, экраны настроек и магазина, подсветки, эффекты ---------- */
#bgcanvas{position:fixed;inset:0;width:100vw;height:100vh;height:100lvh;image-rendering:pixelated;z-index:0;pointer-events:none}
header.wrap,.wrap.app{position:relative;z-index:1}
.fxcanvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:40;pointer-events:none}
.panel,.center,.seat,.opp{background:rgba(6,18,16,.72)}
.opp,.seat{position:relative}
.nav{display:flex;gap:6px;align-items:center}
.nav .btn{padding:7px 12px;font-size:14px}
.coins{background:rgba(0,0,0,.35);color:var(--brass);border:1px solid rgba(226,173,75,.45);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.vtitle{font-size:18px}
.ntag{display:flex;flex-direction:column;gap:1px;min-width:0}
.name{display:flex;align-items:center;gap:6px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name .dot{width:9px;height:9px;border-radius:50%;background:var(--pc,#f2c14e);flex:none;box-shadow:0 0 6px var(--pc,#f2c14e)}
.ptitle{font-size:11px;color:var(--brass);letter-spacing:.04em;padding-left:15px}
.hat{display:inline-flex;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
@keyframes glowo{0%,100%{opacity:.15}50%{opacity:1}}
.opp.turn,.seat.turn{animation:none;border-color:rgba(255,255,255,.15)}
:root[data-hlturn] .opp.turn,:root[data-hlturn] .seat.turn{border-color:var(--pc)}
:root[data-hlturn] .opp.turn::after,:root[data-hlturn] .seat.turn::after{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 0 1px var(--pc),0 0 16px 2px var(--pc);pointer-events:none;animation:glowo 1.8s ease-in-out infinite;will-change:opacity}
:root[data-anim="off"] .opp.turn::after,:root[data-anim="off"] .seat.turn::after{animation:none;opacity:.6}
:root[data-hlturn] .opp.turn .name span,:root[data-hlturn] .status b{color:var(--pc)}
.card.owned{box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),0 0 0 2px var(--own),var(--c-shadow)}
.card.can{box-shadow:inset 0 0 0 var(--c-edge-w) var(--c-edge),0 0 10px 1px color-mix(in srgb,var(--mycolor) 60%,transparent),var(--c-shadow)}
.seat .card.sel{box-shadow:0 0 0 3px var(--mycolor),0 0 18px 3px color-mix(in srgb,var(--mycolor) 55%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--felt-line);text-align:center}
.tile.on{border-color:var(--brass);box-shadow:0 0 0 2px rgba(226,173,75,.22)}
.tprev{min-height:64px;display:flex;align-items:center;justify-content:center;width:100%}
.tprev.duo{gap:4px;--cw:30px}
.tprev.duo .card{padding:2px 3px}
.tprev.duo .card.special::after{display:none}
.tprev.emo{font-size:26px;letter-spacing:4px}
.bgprev{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--felt-line)}
.bgprev canvas,.bgprev img{width:100%;aspect-ratio:16/10;image-rendering:pixelated;display:block}
.bgprev.locked canvas,.bgprev.locked img{filter:brightness(.42) saturate(.6)}
.bgprev .q{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P",var(--display);font-size:26px;color:rgba(255,255,255,.85);text-shadow:2px 2px 0 #000}
.tname{font-size:13px;font-weight:500}
.btn.small{padding:6px 12px;font-size:13px}
.btn.confirm{background:#e8664e;color:#fff}
.tag.ok{font-size:12px;color:var(--brass);padding:6px 0}
.seg{display:inline-flex;border:1px solid var(--felt-line);border-radius:999px;overflow:hidden;align-self:flex-start}
.seg button{background:transparent;color:var(--text);border:0;padding:8px 14px;font-size:13px}
.seg button.on{background:var(--brass);color:var(--brass-ink);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:none;background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--felt-line);border-radius:999px;padding:7px 13px;font-size:13px}
.tabs button.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600}
.wallet{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.wallet .bal{display:flex;flex-direction:column}
.wallet .bal b{font-family:var(--display);font-size:24px;color:var(--brass)}
.tbar{width:min(220px,90%);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--brass);transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{from{transform:scaleX(var(--f,1));background:var(--brass)}75%{background:var(--brass)}to{transform:scaleX(0);background:#e8664e}}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.reacts button{background:rgba(0,0,0,.3);border:1px solid var(--felt-line);border-radius:999px;font-size:20px;line-height:1;padding:6px 10px}
.reacts button:active{transform:scale(.9)}
.floatemoji{position:fixed;z-index:45;font-size:36px;pointer-events:none;animation:floatup 1.8s ease-out forwards;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
@keyframes floatup{0%{transform:translateY(0) scale(.4);opacity:0}15%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-120px) scale(1);opacity:0}}
.bigtxt{position:fixed;left:50%;top:42%;z-index:45;font-family:"Press Start 2P",var(--display);font-size:clamp(18px,6vw,30px);color:#ffd27a;text-shadow:3px 3px 0 #000;white-space:nowrap;pointer-events:none;animation:bigtxt 1.6s ease-out forwards}
.bigtxt.hot{color:#ff8a2a;font-size:clamp(16px,5vw,26px)}
@keyframes bigtxt{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.coinpop{position:fixed;z-index:45;font-family:var(--display);font-weight:700;font-size:20px;color:#7ee0b5;text-shadow:2px 2px 0 #000;pointer-events:none;animation:coinpop 1.7s ease-out forwards}
.coinpop.neg{color:#ff8b7b}
@keyframes coinpop{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(6px) scale(1.2);opacity:1}100%{transform:translateY(46px) scale(1);opacity:0}}
@keyframes shakeall{0%,100%{transform:none}15%{transform:translate(-6px,2px)}30%{transform:translate(6px,-2px)}45%{transform:translate(-4px,1px)}60%{transform:translate(4px,0)}80%{transform:translate(-2px,0)}}
.shakeall{animation:shakeall .5s ease-in-out}
:root[data-big]{--cwb:clamp(44px,min(15vw,8.6vh),84px)}
:root[data-anim="fast"] .pile .card.fresh,:root[data-anim="fast"] .hand>.card.drawin,:root[data-anim="fast"] .seat .card.dealin{animation-duration:.3s}
:root[data-anim="off"] .pile .card.fresh,:root[data-anim="off"] .hand>.card.drawin,:root[data-anim="off"] .seat .card.dealin,:root[data-anim="off"] .pile.burning,:root[data-anim="off"] .status.pop,:root[data-anim="off"] .loser{animation:none!important}
:root[data-anim="off"] .burnfx,:root[data-anim="off"] .burntxt{display:none}


.flying{position:fixed;z-index:42;margin:0;pointer-events:none}
.discard{position:relative;width:var(--cw);aspect-ratio:5/7}
.discard>.card{position:absolute;inset:0;width:100%}
.discard.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.flipbox{position:fixed;z-index:43;transform:translate(-50%,-50%) scale(1.25);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;--cw:var(--cwb)}
.flipinner{position:relative;width:var(--cw);aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1.35)}
.flipinner.open{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fface>.card{width:100%;height:100%}
.ffront{transform:rotateY(180deg)}
.fliplabel{font-family:var(--display);font-size:11px;white-space:nowrap;background:rgba(0,0,0,.75);color:#fff;padding:5px 10px;border-radius:999px}
.fliplabel.good{background:#2e9e6e}
.fliplabel.bad{background:#c23a2b}

.av{border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--pc,#f2c14e);background:#0c2b26}
.av.ini{display:inline-grid;place-items:center;background:var(--pc,#f2c14e);color:#1c1b19;font-weight:700;font-family:var(--display);line-height:1}
.avbig{flex:none}
.avbig .av{box-shadow:0 0 0 3px var(--pc,#f2c14e),0 6px 18px rgba(0,0,0,.4)}
.profrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.profed.welcome{border-color:var(--brass)}
.name .dot{display:none}

.ytmini{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:35;width:200px;height:200px;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid var(--felt-line);background:#000}
.ytmini iframe{width:100%;height:100%;border:0;display:block}
.ytclose{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}

.flipinner.wobble{animation:wobble .7s ease-in-out}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

/* ---------- Balatro: веер, наклон, пружина, вспышки ---------- */
.hand.fan{flex-wrap:nowrap;justify-content:center;gap:0;padding-top:18px;padding-bottom:6px}
.hand.fan>.card+.card{margin-left:var(--ov,6px)}
.hand>.card{--base:translateY(calc(var(--fy,0px) + var(--lift,0px))) rotate(var(--fr,0deg));transform:var(--base) perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .22s cubic-bezier(.2,.8,.3,1.35),margin .2s;animation:sway 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.45s)}
.hand>button.card:not(:disabled):hover,.hand>button.card.tilt{--lift:-10px;--sc:1.06;transform:var(--base) perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));z-index:3}
.hand>.card.sel{--lift:-24px;--sc:1.04;transform:var(--base) perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1))!important;z-index:2}
@keyframes sway{0%,100%{translate:0 0}50%{translate:0 -3px}}
.hand>.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.38),rgba(255,255,255,0) 55%);opacity:0;transition:opacity .2s;pointer-events:none}
.hand>.card.tilt::before{opacity:1}
.hand>.card.drawin{animation:hdrawin .65s cubic-bezier(.18,.9,.3,1.3) backwards,sway 3.4s ease-in-out .65s infinite}
.seat .hand>.card.dealin{animation:hdealin .8s cubic-bezier(.18,.85,.3,1.2) backwards,sway 3.4s ease-in-out .8s infinite}
@keyframes hdrawin{0%{transform:translate(0,-80px) scale(.7) rotate(10deg);opacity:0}60%{transform:translate(0,8px) scale(1.1) rotate(-2deg);opacity:1}100%{transform:var(--base);opacity:1}}
@keyframes hdealin{0%{transform:translate(0,-180px) rotate(20deg) scale(.6);opacity:0}100%{transform:var(--base);opacity:1}}
@keyframes flyin{0%{transform:translate(0,130%) rotate(-20deg) scale(.6);opacity:0}50%{transform:translate(0,-14%) rotate(4deg) scale(1.14);opacity:1}68%{transform:translate(0,3%) rotate(-1deg) scale(1.16,.84)}82%{transform:translate(0,-1%) scale(.95,1.06)}100%{transform:var(--rot,none);opacity:1}}
.center.jolt{animation:jolt .4s ease-out .32s}
@keyframes jolt{0%,100%{transform:none}35%{transform:translateY(3px) scaleY(.995)}70%{transform:translateY(-1px)}}
.pile.flash::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--cw)*2);height:calc(var(--cw)*2);margin:calc(var(--cw)*-1) 0 0 calc(var(--cw)*-1);border-radius:50%;pointer-events:none;animation:sflash .9s ease-out .35s backwards;opacity:0}
.pile.f2::after{background:radial-gradient(circle,rgba(242,193,78,.75),rgba(242,193,78,0) 65%)}
.pile.f8::after{background:radial-gradient(circle,rgba(160,220,255,.7),rgba(160,220,255,0) 65%)}
@keyframes sflash{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.spop{position:absolute;left:50%;top:-6px;font-family:"Press Start 2P",var(--display);font-size:11px;white-space:nowrap;padding:5px 9px;border-radius:6px;text-shadow:1px 1px 0 #000;pointer-events:none;animation:spop 1.6s cubic-bezier(.2,.9,.3,1.4) .35s both;z-index:4}
.spop.s2{background:#f2c14e;color:#2a1d05;text-shadow:none}
.spop.s8{background:#9fd8ff;color:#06263a;text-shadow:none}
@keyframes spop{0%{transform:translate(-50%,20px) scale(.3) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-14px) scale(1.15) rotate(3deg);opacity:1}40%{transform:translate(-50%,-8px) scale(1) rotate(-2deg)}80%{opacity:1;transform:translate(-50%,-10px) rotate(0)}100%{transform:translate(-50%,-26px);opacity:0}}
.coins.counting{animation:cpulse .25s ease-in-out infinite alternate;border-color:var(--brass)}
@keyframes cpulse{from{transform:scale(1)}to{transform:scale(1.08)}}
:root[data-anim="off"] .opp.turn,:root[data-anim="off"] .seat.turn,:root[data-anim="off"] .hand>.card,:root[data-anim="off"] .center.jolt,:root[data-anim="off"] .spop,:root[data-anim="off"] .pile.flash::after{animation:none!important}
:root[data-anim="fast"] .hand>.card.drawin,:root[data-anim="fast"] .seat .hand>.card.dealin{animation-duration:.3s,3.4s}

:root[data-hlturn] .opp.turn .name span.av,:root[data-hlturn] .seat.turn .name span.av{color:#1c1b19}
/* ---------- казино ---------- */
.panel.casino{padding:12px}
.machine{display:flex;flex-direction:column;gap:12px}
.mtitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mtitle b{font-family:"Press Start 2P",var(--display);font-size:13px;color:var(--brass);letter-spacing:.06em;text-shadow:2px 2px 0 #000}
.mwin{position:relative;background:#0a201c;border:3px solid #b9862c;border-radius:14px;padding:8px;box-shadow:inset 0 0 0 2px #5a3a12,0 0 0 2px #2a1a08}
.reels{display:grid;gap:6px}
.reels.r3{grid-template-columns:repeat(3,1fr);max-width:320px;margin:0 auto}
.reels.r5{grid-template-columns:repeat(5,1fr)}
.reelc{position:relative;overflow:hidden;background:#f7f1e1;border-radius:8px;aspect-ratio:1/3}
.reelc::after{content:"";position:absolute;inset:0;background:linear-gradient(#0a201c 0,rgba(10,32,28,0) 20%,rgba(10,32,28,0) 80%,#0a201c 100%);opacity:.5;pointer-events:none}
.reelc.thunk{animation:thunk .28s ease-out}
@keyframes thunk{0%{transform:translateY(0)}40%{transform:translateY(5px)}100%{transform:translateY(0)}}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.cellc{height:calc(100% / 3);aspect-ratio:1/1;width:100%;display:grid;place-items:center}
.reelc .cellc{height:auto}
.strip{display:flex;flex-direction:column}
.strip .cellc{flex:none;width:100%;aspect-ratio:1/1}
.cellc .sym{width:78%;height:78%;image-rendering:pixelated;user-select:none}
.cellc.blur .sym{filter:blur(1px);opacity:.85}
.cellc.winc{background:radial-gradient(circle,rgba(126,224,181,.55),rgba(126,224,181,0) 70%);animation:winc .5s ease-in-out 4 alternate}
@keyframes winc{from{transform:scale(1)}to{transform:scale(1.12)}}
.payline{position:absolute;left:6px;right:6px;top:50%;height:4px;margin-top:-2px;background:#e8664e;opacity:.6;border-radius:2px;z-index:2;pointer-events:none}
.mbanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:#1c1b19;color:#ffd27a;border:2px solid var(--brass);font-family:"Press Start 2P",var(--display);font-size:11px;padding:10px 14px;border-radius:10px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.mbanner.pop{animation:spop .5s cubic-bezier(.2,.9,.3,1.4) both;animation-name:mpop}
@keyframes mpop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.betrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.betrow input{width:84px;padding:8px 10px}
.btn.big{padding:12px 22px;font-size:15px;margin-left:auto}
.cout{font-weight:600;min-height:22px}
.cout.win{color:#7ee0b5}.cout.lose{color:#ff8b7b}
.pdet summary{cursor:pointer;color:var(--muted);font-size:13px}
.paytab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:8px;font-size:13px}
.paytab>div{display:flex;align-items:center;gap:3px}
.paytab b{margin-left:auto;color:var(--brass)}
.psym{width:22px;height:22px;image-rendering:pixelated}
.psym.inl{width:16px;height:16px;vertical-align:-3px}
.paytab.five{grid-template-columns:1fr}
.paytab.five .phead,.paytab.five .prow{display:grid;grid-template-columns:40px repeat(3,1fr);align-items:center;text-align:center}
.paytab.five .phead span{color:var(--muted);font-size:12px}
.paytab.five .prow b{margin:0}
.chestpick{display:flex;flex-direction:column;align-items:center;gap:8px}
.chestrow{display:flex;gap:12px}
.chestbtn{position:relative;background:#0a201c;border:2px solid #b9862c;border-radius:12px;padding:10px;cursor:pointer;animation:chestbob 1.2s ease-in-out infinite}
.chestbtn:nth-child(2){animation-delay:-.4s}.chestbtn:nth-child(3){animation-delay:-.8s}
@keyframes chestbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.chestimg{width:64px;height:64px;image-rendering:pixelated;display:block}
.chestbtn.chosen{border-color:#7ee0b5;animation:shake .5s ease-in-out}
.chestbtn.other{opacity:.5;animation:none}
.chestbtn.open{animation:pop .5s cubic-bezier(.2,.9,.3,1.4);border-color:#7ee0b5;box-shadow:0 0 18px rgba(126,224,181,.6)}
.chestbtn .prize{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:var(--brass);color:#2a1d05;font-family:"Press Start 2P",var(--display);font-size:10px;padding:4px 6px;border-radius:6px}
.chestbtn.other .prize{background:#555;color:#ddd}
.rstrip{position:relative;height:58px;overflow:hidden;border-radius:10px;background:#0a201c;border:3px solid #b9862c}
.rrow{position:absolute;top:4px;left:0;display:flex;gap:4px;will-change:transform}
.rcell{width:44px;height:44px;flex:none;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-size:13px}
.rcell.red{background:#c23a2b}.rcell.black{background:#1c1b19;box-shadow:inset 0 0 0 1px #333}.rcell.green{background:#2e9e6e}
.rcell.mini{width:26px;height:26px;font-size:10px}
.rmark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--brass);z-index:2;box-shadow:0 0 8px var(--brass)}
.rhist{display:flex;gap:4px;flex-wrap:wrap;min-height:26px}
.rpicks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpick{border:0;border-radius:12px;padding:12px 6px;font-weight:700;color:#fff;font-size:14px}
.rpick.red{background:#c23a2b}.rpick.black{background:#2a2a2e}.rpick.green{background:#2e9e6e}
.rpick:disabled{opacity:.45}
.hrow{display:flex;align-items:center;justify-content:center;gap:24px}
.hcard{--cw:clamp(70px,22vw,96px)}
.hcard .card.hflip{animation:hflip .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes hflip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.hside{display:flex;flex-direction:column;align-items:center}
.hmult{font-family:"Press Start 2P",var(--display);font-size:22px;color:var(--brass)}
.hmult.up{animation:pop .45s cubic-bezier(.2,.9,.3,1.4);color:#7ee0b5}
.hmult.bust{color:#ff8b7b}
.htrail{display:flex;gap:4px;justify-content:center;min-height:30px;--cw:24px}
.htrail .card{padding:1px 2px;border-radius:3px}
.htrail .card.special::after{display:none}
.hbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hbtns .btn{padding:12px 6px}
:root[data-anim="off"] .chestbtn,:root[data-anim="off"] .cellc.winc,:root[data-anim="off"] .reelc.thunk{animation:none}
.nav{gap:4px}
.nav .btn{padding:6px 9px;font-size:15px;line-height:1}
.coins{padding:5px 10px;font-size:14px}
@media (max-width:420px){.hdr .brand h1{font-size:20px}.hdr .by{font-size:10px}}

/* ---------- стол без коробок, под вертикальный экран ---------- */
body.tablemode .hdr .brand{display:none}
body.tablemode .hdr{padding-block:8px 0;justify-content:flex-end}
body.tablemode .wrap.app{min-height:calc(100dvh - 54px);padding-block:4px 10px;gap:6px}
body.tablemode .tbar-top .btn.tiny,.btn.tiny{padding:5px 10px;font-size:13px}
.btn.tiny[aria-pressed="false"]{opacity:.45}
body.tablemode .opps{display:flex;flex-direction:column;gap:4px}
body.tablemode .opp,body.tablemode .center,body.tablemode .seat{background:transparent;border:0;box-shadow:none;padding:4px 2px;border-radius:0}
body.tablemode .opp{flex-direction:row;align-items:center;gap:8px;flex-wrap:nowrap}
body.tablemode .opp .ntag{min-width:0;flex:0 1 auto}
body.tablemode .opp>.chip{flex:none}
body.tablemode .opp.turn::after,body.tablemode .seat.turn::after{display:none}
body.tablemode .opp.turn .av,body.tablemode .seat.turn .av{animation:avglow 1.6s ease-in-out infinite}
@keyframes avglow{0%,100%{box-shadow:0 0 0 2px var(--pc)}50%{box-shadow:0 0 0 2px var(--pc),0 0 16px 4px var(--pc)}}
body.tablemode .name span,body.tablemode .ptitle,body.tablemode .side,body.tablemode .need,body.tablemode .status,body.tablemode .tbar-top{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.otab{display:flex;gap:5px;margin-left:auto}
.otab .slot{width:var(--cw);aspect-ratio:5/7;position:relative}
.otab .slot>.card{position:absolute;inset:0;width:100%}
.otab .slot>.card.upc{transform:translate(3px,-4px)}
.ohand{display:flex;align-items:center;gap:4px;flex:none}
.ohand b{font-size:13px;text-shadow:0 1px 3px #000}
.ofan{display:flex}
.ofan .card{margin-left:calc(var(--cw)*-.62)}
.ofan .card:first-child{margin-left:0}
body.tablemode .mini{--cw:clamp(22px,calc(var(--cwb)*.48),30px)}
body.tablemode .center{flex:1;grid-template-columns:auto 1fr auto;align-items:center;padding:6px 4px;gap:6px}
body.tablemode .center .pilebox{--cw:calc(var(--cwb)*1.45)}
body.tablemode .center .side{--cw:calc(var(--cwb)*.8)}
body.tablemode .pile{width:calc(var(--cw)*2.3)}
body.tablemode .status{font-size:clamp(15px,4.4vw,20px)}
body.tablemode .seat{margin-top:auto;gap:4px}
.meline{display:flex;align-items:center;gap:10px}
.meline .tableau{margin-left:auto;--cw:calc(var(--cwb)*.82);gap:6px;flex-wrap:nowrap}
body.tablemode .hand{--cw:calc(var(--cwb)*1.35);min-height:calc(var(--cw)*1.4 + 18px)}
body.tablemode .seat>.row{gap:8px}
body.tablemode .seat>.row .btn{flex:1;padding:12px 10px}
body.tablemode .reacts button{padding:4px 8px;font-size:17px}
:root[data-nohints] .need,:root[data-nohints] .hint{display:none!important}
@media (max-width:560px){body.tablemode .center{grid-template-columns:auto minmax(0,1fr) auto}}

/* ---------- растягивание под любое окно ---------- */
:root{--cwb:clamp(38px,min(11.5vw,8.2vh),118px)}
:root[data-big]{--cwb:clamp(44px,min(14vw,9.6vh),132px)}
body.tablemode .wrap{max-width:min(1200px,100%)}
body.tablemode .mini{--cw:clamp(22px,calc(var(--cwb)*.5),56px)}
body.tablemode .ohand b,body.tablemode .name span{font-size:clamp(13px,calc(var(--cwb)*.24),20px)}
body.tablemode .status{font-size:clamp(15px,calc(var(--cwb)*.3),28px)}
body.tablemode .need,body.tablemode .side{font-size:clamp(11px,calc(var(--cwb)*.19),16px)}
body.tablemode .seat>.row .btn{font-size:clamp(14px,calc(var(--cwb)*.22),20px)}
body.tablemode .seat>.row{max-width:640px;width:100%;margin-inline:auto}
body.tablemode .reacts{justify-content:center}
/* в полноэкранном режиме Telegram кладёт свои кнопки поверх: отодвигаемся */
body.fs .hdr{padding-top:calc(8px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
body.fs.tablemode .wrap.app{min-height:calc(100dvh - 54px - var(--tg-safe-area-inset-top,0px) - var(--tg-content-safe-area-inset-top,0px))}

/* ---------- экран выбора трёх карт ---------- */
.swapstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,20px);text-align:center;padding:8px 0}
.swttl{font-family:var(--display);font-weight:700;font-size:clamp(22px,calc(var(--cwb)*.36),36px);color:#ffe6a0;text-shadow:0 2px 10px #000}
.swttl.anim{animation:swttl .55s cubic-bezier(.2,.9,.3,1.4) .1s both}
@keyframes swttl{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
.swsub{font-size:clamp(12px,calc(var(--cwb)*.2),16px);text-shadow:0 1px 3px #000;max-width:30em}
.swsub.anim{animation:fadein .4s ease-out 1.1s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.swdowns{display:flex;gap:clamp(10px,3vw,18px);--cw:calc(var(--cwb)*1.15)}
.swdowns .card.back{position:relative}
.swdowns .card.myst{animation:myst 2s ease-in-out infinite}
.swdowns .card.swdrop{animation:swdrop .5s cubic-bezier(.2,.8,.3,1.2) both,myst 2s ease-in-out .8s infinite}
@keyframes myst{0%,100%{box-shadow:inset 0 0 0 3px var(--c-back-edge),0 0 0 0 rgba(185,164,255,0)}50%{box-shadow:inset 0 0 0 3px var(--c-back-edge),0 0 22px 6px rgba(185,164,255,.8)}}
@keyframes swdrop{0%{transform:translateY(-140px) rotate(-15deg) scale(.6);opacity:0}100%{opacity:1}}
.swq{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P",var(--display);font-size:calc(var(--cw)*.36);color:rgba(255,255,255,.9);text-shadow:0 2px 6px #000}
.swsix{display:grid;grid-template-columns:repeat(3,var(--cw));gap:clamp(10px,2vh,18px) clamp(10px,3vw,18px);--cw:min(calc(var(--cwb)*1.2),calc((100vw - 80px)/3.4));padding-top:12px}
@media (min-aspect-ratio:1/1){.swsix{grid-template-columns:repeat(6,var(--cw));--cw:min(calc(var(--cwb)*1.2),calc((100vw - 120px)/7))}}
.swsix .card{transition:transform .3s cubic-bezier(.2,.9,.3,1.4),box-shadow .2s}
.swsix .card.sel{transform:translateY(-12px)!important;box-shadow:0 0 0 3px var(--mycolor),0 0 20px color-mix(in srgb,var(--mycolor) 70%,transparent)!important}
.swsix .card.strong::before{content:"сильная";position:absolute;left:50%;top:-10px;transform:translateX(-50%);font:600 10px/1 var(--body);background:var(--brass);color:var(--brass-ink);padding:3px 6px;border-radius:999px;white-space:nowrap;z-index:2}
.swsix .card.swfly{animation:swfly .55s cubic-bezier(.18,.9,.3,1.25) both}
@keyframes swfly{0%{transform:translateY(60vh) rotate(18deg) scale(.6);opacity:0}100%{opacity:1}}
.btn.big.swgo{margin:4px auto 0}
:root[data-anim="off"] .swdowns .card.myst{animation:none}

/* ---------- одинаковые слоты ---------- */
.machine{max-width:460px;width:100%;margin-inline:auto}
.panel.casino{display:flex;justify-content:center}
/* один размер клетки для всех автоматов: по ширине телефона, но не выше ~четверти экрана */
.reels{--cs:min(72px,8.6vh,calc((100vw - 104px) / 5))}
.reels.r3,.reels.r5{display:flex;justify-content:center;gap:6px;max-width:none;margin:0 auto}
.reels .reelc{width:var(--cs);aspect-ratio:1/3;flex:none}
/* ---------- напряжённый момент ---------- */
body.tense #bgcanvas{filter:grayscale(1) brightness(.35) contrast(1.1);transition:filter 1.6s}
#bgcanvas{transition:filter .8s}
body.flash #bgcanvas{filter:brightness(1.6) saturate(1.4);transition:filter .25s}
body.tense::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 25%,rgba(0,0,0,.85) 85%);pointer-events:none;z-index:2;animation:tbreath 2.4s ease-in-out infinite}
@keyframes tbreath{50%{opacity:.8}}
body.tense .tbar-top,body.tense .hdr{opacity:.25;transition:opacity 1s}
.tensestage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,22px);text-align:center;position:relative;z-index:3}
.tpile{font-size:13px;color:#cfd8d4;text-shadow:0 1px 3px #000}
.tttl{font-family:var(--display);font-weight:700;font-size:clamp(20px,calc(var(--cwb)*.34),34px);color:#e9e3d0;letter-spacing:.04em;text-shadow:0 2px 10px #000;animation:fadein 1s ease-out .4s both;margin-bottom:clamp(18px,4vh,40px)}
.tsub{font-size:12px;color:#b9b4a6;text-shadow:0 1px 3px #000;max-width:26em;animation:fadein 1s ease-out .8s both}
.trow{display:flex;gap:clamp(12px,4vw,24px);perspective:700px;--cw:calc(var(--cwb)*1.3)}
.tcard{width:var(--cw);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.3,.6,.25,1),filter .6s,opacity .5s;cursor:pointer;animation:thover 3s ease-in-out infinite}
.tcard:nth-child(2){animation-delay:-1s}.tcard:nth-child(3){animation-delay:-2s}
@keyframes thover{50%{translate:0 -6px}}
.tcard .tb,.tcard .tf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tcard .tb>.card,.tcard .tf>.card{width:100%;height:100%}
.tcard .tf{transform:rotateY(180deg)}
.tcard.picked{transform:translateY(-10px) scale(1.18);z-index:3;animation:none}
.tcard.picked.open{transform:translateY(-10px) scale(1.18) rotateY(180deg)}
.tcard.dimmed{filter:brightness(.35);animation:none}
.tcard.red .tf>.card{background:#1a1a1c;color:#ff4a3a;text-shadow:0 0 8px #ff2a1a,0 0 18px rgba(255,40,20,.8);box-shadow:0 0 0 2px rgba(255,60,40,.6),0 0 30px rgba(255,40,20,.55)}
.tcard.blk .tf>.card{background:#1a1a1c;color:#e6f4ff;text-shadow:0 0 8px #9fd8ff,0 0 18px rgba(160,220,255,.8);box-shadow:0 0 0 2px rgba(160,220,255,.6),0 0 30px rgba(160,220,255,.5)}
.tcard.daylight .tf>.card{background:var(--c-bg);text-shadow:none;box-shadow:0 0 0 3px #7ee0b5,0 0 26px rgba(126,224,181,.8);transition:all .4s}
.tcard.daylight.red .tf>.card{color:var(--c-red)}.tcard.daylight.blk .tf>.card{color:var(--c-ink)}
.tcard.away{transform:translateY(-55vh) scale(.6) rotateY(180deg);opacity:0;transition:transform .5s cubic-bezier(.5,0,.8,.4),opacity .5s}
.tres{font-family:var(--display);font-weight:700;font-size:clamp(17px,calc(var(--cwb)*.28),26px);min-height:30px;opacity:0;transform:scale(.6);transition:opacity .3s,transform .45s cubic-bezier(.2,.9,.3,1.5)}
.tres.on{opacity:1;transform:none}.tres.good{color:#7ee0b5;text-shadow:0 0 12px rgba(126,224,181,.9)}.tres.bad{color:#ff8b7b;text-shadow:0 0 12px rgba(255,100,80,.8);font-size:clamp(14px,calc(var(--cwb)*.22),20px)}
.spark{position:fixed;width:5px;height:5px;z-index:46;pointer-events:none}
.sring{position:fixed;width:20px;height:20px;border-radius:50%;border:3px solid;transform:translate(-50%,-50%) scale(.2);z-index:46;pointer-events:none;animation:sring .9s ease-out forwards}
@keyframes sring{to{transform:translate(-50%,-50%) scale(9);opacity:0;border-width:1px}}
/* ---------- шторки: выход и конец партии ---------- */
body:has(.sheet) .toast{bottom:calc(var(--sheeth,230px) + 24px);z-index:31}
.sheet{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:rgba(10,20,18,.94);border:1px solid rgba(242,193,78,.5);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:sheetup .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetup{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
.sheet b{font-family:var(--display);font-size:16px;color:#ffe6a0}
.sheet .row{gap:8px}.sheet .row .btn{flex:1}
.votes{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.vote{display:inline-flex;align-items:center;gap:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:999px}
.tag.ok{background:#2e9e6e;color:#fff}.tag.wait{background:rgba(255,255,255,.18);color:#e9efe9}.tag.gone{background:#5a2222;color:#ffb3a8}
/* ---------- ожидание игроков ---------- */
.waitstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px 0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.wttl{font-family:var(--display);font-weight:700;font-size:clamp(19px,5vw,28px);color:#ffe6a0}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.wtimer{font-family:"Press Start 2P",var(--display);font-size:clamp(20px,6vw,30px);color:#e9efe9}
.wseats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(460px,100%)}
.wseat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--text);padding:0}
.wseat .wn{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wseat.empty .wplus{width:46px;height:46px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.6);animation:wpulse 1.6s ease-in-out infinite}
@keyframes wpulse{50%{border-color:rgba(242,193,78,.95);color:#f2c14e}}
.wkick{position:absolute;top:-4px;right:6px;width:20px;height:20px;border-radius:50%;border:0;background:#5a2222;color:#fff;font-size:12px;line-height:1;padding:0}
.wcount{font-weight:600;color:#7ee0b5}
.wopts{display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(0,0,0,.3);padding:10px 14px;border-radius:14px;max-width:460px}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* ---------- открытые столы и лента ---------- */
.otables{display:flex;flex-direction:column;gap:6px}
.otrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25)}
.otav{display:flex;gap:2px;flex:1;min-width:0}
.feed{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid rgba(242,193,78,.35);border-radius:999px;padding:6px 10px;overflow:hidden}
.flabel{font-family:"Press Start 2P",var(--display);font-size:9px;background:#e8664e;color:#fff;padding:4px 6px;border-radius:6px;flex:none;animation:livepulse 1.6s ease-in-out infinite}
@keyframes livepulse{50%{opacity:.55}}
.fwin{overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ftrack{display:inline-flex;gap:28px;white-space:nowrap;animation:marquee 30s linear infinite;font-size:13px}
.fitem{display:inline-flex;align-items:center;gap:6px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
:root[data-anim="off"] .ftrack{animation-duration:90s}

/* ---------- плавающая панель с балансом ---------- */
.navph{display:none;flex:none}
header.hdr:has(.nav.float){z-index:24}
.hdr .nav.float{position:fixed;top:calc(8px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));z-index:25;padding:4px;border-radius:999px;background:rgba(8,18,16,.55);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:navdown .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes navdown{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
.hdr .nav>*{transition:opacity .25s}
.hdr .nav.float{pointer-events:none;transition:background .25s,box-shadow .25s}
.hdr .nav.float>*{pointer-events:auto}
.hdr .nav.float>.yield{opacity:.28;pointer-events:none}
.hdr .nav.float:has(>.yield){background:rgba(8,18,16,.2);box-shadow:none}
.av.anon{border:1px dashed #7d8b87}
.ntag.gone{min-width:0;min-height:0;padding:0}
.eyebtn[aria-pressed="true"]{background:rgba(242,193,78,.25)}

/* ---------- рука в два ряда ---------- */
.hand.rows2{display:grid;grid-template-columns:repeat(var(--cols),var(--step,28px));justify-content:center;gap:0;padding-top:16px;padding-right:calc(var(--cw) - var(--step,28px));padding-bottom:4px}
.hand.rows2>.card{--fr:0deg;--fy:0px}
.hand.rows2>.card.r2{margin-top:calc(var(--cw) * -.42);z-index:1}
.hand.rows2>.card:not(.drawin){animation:none}
body.chaton .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.hand.rows2>.card.r2:hover,.hand.rows2>.card.r2.sel{z-index:4}
/* ---------- чат ---------- */
.chatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 16px));display:flex;gap:6px;align-items:center;z-index:12;background:rgba(6,14,12,.72);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 4px 4px 14px}
.chatbar input{flex:1;min-width:0;background:none;border:0;color:var(--text,#e9efe9);font-size:14px;padding:6px 0;outline:none}
.chatbar input::placeholder{color:rgba(233,239,233,.45)}
.chatbar .btn{padding:6px 12px;font-size:14px;border-radius:999px}
.chatbar .ccount{font-size:10px;color:#ffb3a8}
body.chaton .wrap.app{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px))}
body.tense .chatbar{display:none}
.cbub{position:absolute;left:10px;bottom:calc(100% - 4px);max-width:min(240px,70vw);background:#f7f1e1;color:#1c1b19;font-size:13px;line-height:1.3;padding:6px 10px;border-radius:14px 14px 14px 4px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none;animation:cbub 6.5s ease both}
.cbub.mine{background:#ffe6a0}
.seat>.cbub{bottom:auto;top:-10px;transform:translateY(-100%)}
@keyframes cbub{0%{opacity:0;translate:0 8px;scale:.8}5%{opacity:1;translate:0 0;scale:1}88%{opacity:1}100%{opacity:0;translate:0 -6px}}
/* ---------- друзья ---------- */
.frhead{justify-content:space-between}
.frlist{display:flex;flex-direction:column;gap:6px}
.frrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:rgba(0,0,0,.25)}
.frav{position:relative;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b7a76;border:2px solid #0e1f1b}
.frav .dot{position:absolute;right:-1px;bottom:-1px}
.dot.online{background:#4cd98a}.dot.game{background:#f2c14e}
.frn{flex:1;min-width:0;display:flex;flex-direction:column}
.frn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frx{opacity:.6}
.wfriends{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:460px}
.wfrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.frchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:var(--text,#e9efe9);font-size:13px}
.frchip.offline{opacity:.7}
.addfr{position:absolute;top:-6px;left:4px;width:24px;height:24px;border-radius:50%;border:0;background:#2e9e6e;font-size:12px;line-height:1;padding:0;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.vote{position:relative}.vote .addfr{position:static;width:22px;height:22px}
.invbox{position:fixed;left:50%;top:calc(10px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));transform:translateX(-50%);width:min(420px,calc(100% - 20px));display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(10,24,20,.96);border:1px solid rgba(242,193,78,.6);box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:40;animation:navdown .4s cubic-bezier(.2,.9,.3,1.15)}
.invt{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- стопки одинаковых карт в руке ---------- */
.hand>.card.grp2{box-shadow:4px -4px 0 -1px #e6dcc2,4px -4px 0 0 rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25)}
.hand>.card.grp3{box-shadow:4px -4px 0 -1px #e6dcc2,4px -4px 0 0 rgba(0,0,0,.28),8px -8px 0 -1px #ddd2b6,8px -8px 0 0 rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25)}
.gbadge{position:absolute;left:-6px;bottom:-8px;z-index:3;background:#e8664e;color:#fff;font:700 12px/1 var(--body);padding:4px 6px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.45);pointer-events:none}
.seat .hand>.card.grp2.sel{box-shadow:4px -4px 0 -1px #e6dcc2,0 0 0 3px var(--mycolor),0 0 18px 3px color-mix(in srgb,var(--mycolor) 55%,transparent)}
.seat .hand>.card.grp3.sel{box-shadow:4px -4px 0 -1px #e6dcc2,8px -8px 0 -1px #ddd2b6,0 0 0 3px var(--mycolor),0 0 18px 3px color-mix(in srgb,var(--mycolor) 55%,transparent)}
.btn.allbtn{flex:none;padding-inline:12px;white-space:nowrap;background:#e8664e;color:#fff;border:0}
.gbadge.part{background:#f2c14e;color:#2a1c06}
.hand>.card.special .gbadge{bottom:auto;top:-8px}

/* ---------- перетаскивание карт ---------- */
.hand button.card[data-grp]{touch-action:none;-webkit-user-select:none;user-select:none}
.hand>.card.dragsrc{opacity:.35}
.dragghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.dragghost>.card{position:relative;width:100%!important;transform:scale(1.08)!important;animation:none!important}
.dragghost .gcount{position:absolute;right:-8px;top:-10px;background:#e8664e;color:#fff;font:700 13px/1 var(--body);padding:4px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pile.dropok{outline:3px dashed rgba(168,224,126,.9);outline-offset:6px;border-radius:12px}
#frBtn{position:relative}
.frdot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#4cd98a;box-shadow:0 0 0 2px #0e1f1b}

/* ---------- личные сообщения ---------- */
.frn{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.frmsg{position:relative}
.unb{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:#e8664e;color:#fff;font:700 11px/18px var(--body);padding:0 4px}
.frdot.unread{width:16px;height:16px;top:-2px;right:-2px;background:#e8664e;color:#fff;font:700 10px/16px var(--body);text-align:center}
.dmhead{display:flex;align-items:center;gap:10px;flex:1;min-width:0}

function soundsFor(prev,next){
  if(!next||!me) return;
  if(!prev||prev.code!==next.code){ if(next.status==="swap") Sound.fx("deal"); return; }
  if(prev.status!=="swap"&&next.status==="swap") return Sound.fx("deal");
  if(prev.status!=="over"&&next.status==="over"){ if(next.players.some(p=>p.id===me.id)) Sound.fx(next.loser===me.id?"lose":"win"); return; }
  if(next.status!=="play") return;
  const added=next.pile.length-prev.pile.length;
  if(next.burned>prev.burned){ Sound.fx("play"); setTimeout(()=>Sound.fx("burn"),90); }
  else if(added>0){ const top=next.pile[next.pile.length-1]; if(rk(top)==="8") Sound.fx("glass"); else Sound.fx("play",added); }
  else if(prev.pile.length>0&&next.pile.length===0) Sound.fx("take");
  const drew=cnt(prev.deck)-cnt(next.deck);
  if(drew>0) setTimeout(()=>Sound.fx("draw",drew),180);
  const pT=prev.status==="play"&&prev.players[prev.turn]&&prev.players[prev.turn].id;
  const nT=next.players[next.turn]&&next.players[next.turn].id;
  if(nT===me.id&&pT!==me.id) setTimeout(()=>Sound.fx("turn"),380);
}

function resizeImage(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej(new Error("Это не картинка"));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const S=160, c=document.createElement("canvas"); c.width=S; c.height=S; const g=c.getContext("2d");
      const m=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-m)/2, sy=(img.naturalHeight-m)/2;
      g.fillStyle="#123a33"; g.fillRect(0,0,S,S); g.drawImage(img,sx,sy,m,m,0,0,S,S); URL.revokeObjectURL(url);
      let q=.86, d=c.toDataURL("image/jpeg",q); while(d.length>70000&&q>.4){ q-=.12; d=c.toDataURL("image/jpeg",q); } res(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Не получилось открыть картинку")); };
    img.src=url;
  });
}

/* ---------- своя музыка с YouTube (официальный встроенный плеер) ---------- */
function parseYT(u){
  u=String(u||"").trim(); if(!u) return null;
  let url; try{ url=new URL(/^https?:/i.test(u)?u:"https://"+u); }catch(e){ return null; }
  const host=url.hostname.replace(/^www\.|^m\.|^music\./,"");
  const ok=/^[\w-]{6,}$/;
  const list=url.searchParams.get("list");
  let id=null;
  if(host==="youtu.be") id=url.pathname.slice(1).split("/")[0];
  else if(host==="youtube.com"||host==="youtube-nocookie.com"){
    if(url.pathname==="/watch") id=url.searchParams.get("v");
    else { const m=url.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/); if(m) id=m[2]; }
  } else return null;
  if(id&&!ok.test(id)) id=null;
  if(list&&ok.test(list)) return {list,id};
  return id?{id}:null;
}
function ytSrc(v){
  const base="https://www.youtube-nocookie.com/embed/";
  const q="autoplay=1&playsinline=1&rel=0&modestbranding=1";
  if(v.list) return base+(v.id?v.id:"videoseries")+"?list="+encodeURIComponent(v.list)+"&"+q+"&loop=1";
  return base+v.id+"?"+q+"&loop=1&playlist="+v.id;
}

function addTilt(c){
  if(Prefs.get("anim")==="off") return;
  c.addEventListener("pointermove",e=>{ const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    c.style.setProperty("--ry",((x-.5)*22).toFixed(1)+"deg"); c.style.setProperty("--rx",((.5-y)*22).toFixed(1)+"deg");
    c.style.setProperty("--gx",(x*100).toFixed(0)+"%"); c.style.setProperty("--gy",(y*100).toFixed(0)+"%"); c.classList.add("tilt"); });
  c.addEventListener("pointerleave",()=>{ c.style.removeProperty("--rx"); c.style.removeProperty("--ry"); c.classList.remove("tilt"); });
}
function renderSeat(st,myTurn){
  const hand=Array.isArray(st.hands[me.id])?st.hands[me.id]:[], up=st.up[me.id]||[], downN=st.down[me.id]||0;
  const src=st.status==="play"?mySource():null, done=st.finished.includes(me.id);
  const swapping=st.status==="swap"&&!st.ready[me.id];
  const myP=playerOf(me.id)||{};
  const seat=el("div",{class:"seat"+(myTurn?" turn":""),"data-pid":me.id,style:`--pc:${myP.color||"#f2c14e"};--mycolor:${myP.color||"#f2c14e"}`});
  const glowOk=c=>Prefs.get("hlPlayable")&&canPlay(rk(c),st.pile)?"can":"";
  const toggle=(source,c)=>{
    if(selSrc!==source){sel=[];selSrc=source;}
    if(sel.includes(c)){ sel=sel.filter(x=>x!==c); Sound.fx("unpick"); } else { if(sel.length&&rk(sel[0])!==rk(c)) sel=[]; sel.push(c); Sound.fx("pick"); }
    haptic(); render();
  };
  const tab=el("div",{class:"tableau"});
  const upInHand=src==="up", downInHand=src==="down";
  for(let i=0;i<Math.max(downN,up.length);i++){
    const slot=el("div",{class:"slot"});
    if(i<downN&&!downInHand) slot.append(backEl(null,true,"D"+i));
    if(up[i]!==undefined&&!upInHand){
      const c=up[i];
      if(swapping) slot.append(cardEl(c,{extra:"upc",onclick:()=>{ if(swapHand===null) return toast("Сначала выбери карту в руке"); act("swap",swapHand,i); }}));
      else slot.append(cardEl(c,{extra:"upc"}));
    }
    tab.append(slot);
  }
  const handBox=el("div",{class:"hand"});
  // одинаковые карты лежат одной стопкой «×3»: 1 тап — одна карта, 2 тапа — две, 3 — три, ещё тап — снять выбор
  const groupStep=(source,cards)=>{
    if(selSrc!==source||!sel.length||rk(sel[0])!==rk(cards[0])){ sel=[cards[0]]; selSrc=source; Sound.fx("pick"); }
    else { const k=sel.filter(x=>cards.includes(x)).length; if(k>=cards.length){ sel=sel.filter(x=>!cards.includes(x)); Sound.fx("unpick"); } else { sel=[...sel.filter(x=>!cards.includes(x)),...cards.slice(0,k+1)]; Sound.fx("pick"); } }
    haptic();
  };
  const groupTap=(source,cards)=>{ groupStep(source,cards); render(); };
  const groupsOf=arr=>{ const m=[]; arr.forEach(c=>{ const g=m.find(x=>rk(x[0])===rk(c)); if(g) g.push(c); else m.push([c]); }); return m; };
  const grpEl=(source,cards,can)=>{
    const c=cards[0], n=cards.length, k=selSrc===source?sel.filter(x=>cards.includes(x)).length:0;
    const e=can?cardEl(c,{extra:glowOk(c)+(n>1?" grp grp"+Math.min(n,3):""),onclick:()=>groupTap(source,cards),selected:k>0,dim:!canPlay(rk(c),st.pile)}):cardEl(c,{extra:n>1?"grp grp"+Math.min(n,3):""});
    if(n>1){ e.append(el("span",{class:"gbadge"+(k&&k<n?" part":""),text:k&&k<n?`${k}/${n}`:`×${n}`})); e.setAttribute("aria-label",`${rk(c)} ×${n}`+(k?`, выбрано ${k}`:"")); }
    if(can){ e.dataset.grp=cards.join(","); e.dataset.src=source; }
    return e;
  };
  if(swapping) hand.forEach((c,i)=>handBox.append(cardEl(c,{onclick:()=>{swapHand=swapHand===i?null:i;Sound.fx(swapHand===null?"unpick":"pick");haptic();render();},selected:swapHand===i})));
  else groupsOf(hand).forEach(g=>handBox.append(grpEl("hands",g,myTurn&&src==="hands")));
  if(upInHand) groupsOf(up).forEach(g=>handBox.append(grpEl("up",g,myTurn)));
  if(downInHand) for(let i=0;i<downN;i++) handBox.append(backEl(myTurn?()=>act("blind",i):null,!myTurn,"D"+i));
  fanHand(handBox);
  if(!hand.length&&!upInHand&&!downInHand) handBox.append(el("span",{class:"muted small",style:"align-self:center"},done?"Ты вышел из игры":"Рука пустая"));
  if(myTurn&&(src==="hands"||src==="up")) handGestures(handBox,groupStep,st);
  const actions=el("div",{class:"row"});
  if(swapping) actions.append(el("button",{class:"btn",type:"button",onclick:()=>act("ready")},"Готов"),el("span",{class:"muted small hint"},"Нажми карту в руке, потом открытую — они поменяются местами."));
  if(myTurn){
    const canPut=sel.length&&canPlay(rk(sel[0]),st.pile);
    if(src!=="down"){
      const pool=selSrc==="up"?up:hand, all=sel.length?pool.filter(c=>rk(c)===rk(sel[0])):[];
      const lbl=sel.length>1?`Положить ${sel.length}×${rk(sel[0])}`:sel.length?`Положить ${pretty(sel[0])}`:"Выбери карты";
      actions.append(el("button",{class:"btn",type:"button",disabled:!canPut,onclick:()=>act("play",selSrc,[...sel])},lbl));
      if(canPut&&all.length>1&&sel.length<all.length) actions.append(el("button",{class:"btn allbtn",type:"button",onclick:()=>{ Sound.fx("pick"); act("play",selSrc,all); }},`Все ×${all.length}`));
    }
    else actions.append(el("span",{class:"small hint"},"Открой одну из закрытых карт — вслепую."));
    actions.append(el("button",{class:"btn ghost",type:"button",disabled:!st.pile.length,onclick:()=>act("take")},"Забрать стопку"));
  }
  const reacts=(profile&&profile.reacts||[]).length&&st.players.some(p=>p.id!==me.id)?el("div",{class:"reacts",role:"group","aria-label":"Реакции"},profile.reacts.map(e=>el("button",{type:"button","aria-label":"Реакция "+e,onclick:()=>sendMsg({t:"react",e})},e))):null;
  seat.append(el("div",{class:"meline"},nameTag({...myP,name:me.name,avatar:myP.avatar||(profile&&profile.avatar)||""},{you:true}),tab),
    handBox,actions,reacts);
  return seat;
}

/* ---------- полный экран: официальный режим Telegram (Bot API 8.0+), иначе браузерный ---------- */
(function setupFullscreen(){
  const b=document.getElementById("fsBtn"); if(!b) return;
  const tgFS=!!(TG&&typeof TG.requestFullscreen==="function"&&TG.isVersionAtLeast&&TG.isVersionAtLeast("8.0"));
  const brFS=!TG||!TG.initData ? !!(document.fullscreenEnabled&&document.documentElement.requestFullscreen) : false;
  if(!tgFS&&!brFS) return;
  b.hidden=false;
  const isOn=()=>tgFS?!!TG.isFullscreen:!!document.fullscreenElement;
  const sync=()=>{ const on=isOn(); b.setAttribute("aria-pressed",String(on)); b.textContent=on?"⤡":"⛶"; b.title=on?"Выйти из полного экрана":"На весь экран"; document.body.classList.toggle("fs",on); };
  b.addEventListener("click",()=>{ Sound.fx("pick");
    try{ if(tgFS){ isOn()?TG.exitFullscreen():TG.requestFullscreen(); } else { isOn()?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast("Браузер не дал открыть на весь экран")); } }catch(e){ toast("Не получилось открыть на весь экран"); } });
  if(tgFS){ TG.onEvent("fullscreenChanged",sync); TG.onEvent("fullscreenFailed",()=>toast("Telegram не дал открыть на весь экран")); }
  else document.addEventListener("fullscreenchange",sync);
  sync();
})();
/* ---------- давление: сердце бьётся, когда сопернику осталось 1–2 карты ---------- */
const Pressure=(()=>{ let lv=0, iv=null; const beat=()=>{ if(!room||room.status!=="play"){ set(0); return; } Sound.fx("heart"); document.body.classList.remove("beat"); void document.body.offsetWidth; document.body.classList.add("beat"); };
  function set(n){ if(Prefs.get("anim")==="off") n=0; if(n===lv) return; lv=n; clearInterval(iv); iv=null; document.body.classList.toggle("press1",n===1); document.body.classList.toggle("press2",n===2); if(n){ beat(); iv=setInterval(beat,n===2?650:1000); } }
  return {set}; })();

(()=>{ const d=el("div",{id:"dust","aria-hidden":"true"}); for(let i=0;i<22;i++){ const p=el("i"); p.style.left=Math.random()*100+"%"; p.style.top=Math.random()*100+"%";
    p.style.setProperty("--dx",(Math.random()*60-30).toFixed(0)+"px"); p.style.setProperty("--dy",(-30-Math.random()*50).toFixed(0)+"px"); p.style.animationDuration=(6+Math.random()*6).toFixed(1)+"s"; p.style.animationDelay=(-Math.random()*10).toFixed(1)+"s"; d.append(p); }
  document.body.append(d); })();
/* ---------- баланс и кнопки едут вместе с экраном ---------- */
(()=>{
  const nav=document.querySelector(".hdr .nav"), hdr=document.querySelector(".hdr");
  const ph=el("div",{class:"navph","aria-hidden":"true"}); nav.before(ph);
  let floating=false, raf=0;
  const SEL="button,input,select,textarea,a[href],[role=button],[tabindex='0'],label.chk";
  function check(){
    raf=0;
    if(!floating){ const r=nav.getBoundingClientRect(); if(r.top<0&&scrollY>4){ floating=true; ph.style.width=r.width+"px"; ph.style.height=r.height+"px"; ph.style.display="block"; nav.style.right=Math.max(8,innerWidth-r.right)+"px"; nav.classList.add("float"); setTimeout(q,380); } }
    else { const p=ph.getBoundingClientRect(); if(p.top>=0||scrollY<=4){ floating=false; ph.style.display="none"; nav.classList.remove("float"); nav.style.right=""; } }
    // кнопка под панелью важнее: панель становится прозрачной и пропускает нажатие
    const btns=[...nav.children].filter(b=>!b.hidden);
    if(!floating){ btns.forEach(b=>b.classList.remove("yield")); return; }
    const targets=[...document.querySelectorAll("#app "+SEL.split(",").join(",#app "))].map(e=>e.getBoundingClientRect()).filter(r=>r.width&&r.bottom>0&&r.top<120);
    btns.forEach(b=>{ const a=b.getBoundingClientRect(); const hit=targets.some(r=>r.left<a.right-2&&r.right>a.left+2&&r.top<a.bottom-2&&r.bottom>a.top+2); b.classList.toggle("yield",hit); });
  }
  const q=()=>{ if(!raf) raf=requestAnimationFrame(check); };
  addEventListener("scroll",q,{passive:true}); addEventListener("resize",()=>{ if(floating){ floating=false; nav.classList.remove("float"); ph.style.display="none"; } q(); });
  new MutationObserver(q).observe(document.getElementById("app"),{childList:true,subtree:true});
})();
